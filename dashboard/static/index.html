<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor Agent — Incident Dashboard</title>
  <style>
    /* ── Reset & base ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #21262d;
      --border:    #30363d;
      --text:      #c9d1d9;
      --muted:     #8b949e;
      --critical:  #f85149;
      --warning:   #e3b341;
      --ok:        #3fb950;
      --accent:    #58a6ff;
      --radius:    8px;
      --font:      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 16px;
      color: var(--text);
    }

    .logo-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
      animation: pulse 2s infinite;
    }

    .logo-dot.has-critical { background: var(--critical); box-shadow: 0 0 8px var(--critical); }
    .logo-dot.has-warning  { background: var(--warning);  box-shadow: 0 0 8px var(--warning);  }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .refresh-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .refresh-btn:hover { background: var(--border); }

    .countdown {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: var(--radius);
    }
    .countdown-bar {
      width: 60px; height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .countdown-fill {
      height: 100%;
      background: var(--accent);
      transition: width 1s linear;
    }

    /* ── Layout ────────────────────────────────────────────────────── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* ── Stats bar ─────────────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (max-width: 700px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
    }

    .stat-value.critical { color: var(--critical); }
    .stat-value.warning  { color: var(--warning);  }
    .stat-value.ok       { color: var(--ok);        }
    .stat-value.accent   { color: var(--accent);    }

    /* ── Section header ────────────────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .incident-count {
      background: var(--surface2);
      color: var(--muted);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    /* ── Incident cards ────────────────────────────────────────────── */
    .incidents-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .incident-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .incident-card:hover { border-color: var(--accent); }

    .incident-card.severity-critical { border-left: 3px solid var(--critical); }
    .incident-card.severity-warning  { border-left: 3px solid var(--warning);  }
    .incident-card.severity-ok       { border-left: 3px solid var(--ok);       }

    .incident-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
    }

    .incident-id {
      font-family: monospace;
      font-size: 12px;
      color: var(--accent);
      background: rgba(88,166,255,0.1);
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .incident-summary {
      flex: 1;
      font-size: 13px;
      color: var(--text);
      line-height: 1.4;
    }

    .incident-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .confidence-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .confidence-badge.high   { background: rgba(63,185,80,0.15);  color: var(--ok);       border: 1px solid rgba(63,185,80,0.3);  }
    .confidence-badge.medium { background: rgba(227,179,65,0.15); color: var(--warning);  border: 1px solid rgba(227,179,65,0.3); }
    .confidence-badge.low    { background: rgba(248,81,73,0.15);  color: var(--critical); border: 1px solid rgba(248,81,73,0.3);  }

    .incident-time {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .expand-icon {
      color: var(--muted);
      font-size: 16px;
      transition: transform 0.2s;
      width: 16px;
      text-align: center;
    }
    .incident-card.open .expand-icon { transform: rotate(90deg); }

    /* ── Incident body (expanded) ──────────────────────────────────── */
    .incident-body {
      display: none;
      border-top: 1px solid var(--border);
      padding: 16px;
      gap: 16px;
      flex-direction: column;
    }
    .incident-card.open .incident-body { display: flex; }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 600px) { .info-grid { grid-template-columns: 1fr; } }

    .info-block {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
    }
    .info-block.full { grid-column: 1 / -1; }

    .info-block-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .info-block-value {
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
    }

    /* ── Anomalies table ───────────────────────────────────────────── */
    .anomalies-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .anomalies-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .anomalies-table th {
      text-align: left;
      padding: 7px 10px;
      color: var(--muted);
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .anomalies-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .anomalies-table tr:last-child td { border-bottom: none; }
    .anomalies-table tr:hover td { background: var(--surface2); }

    .anomalies-table td:first-child { font-family: monospace; color: var(--muted); }

    .metric-name { color: var(--accent); font-family: monospace; }
    .svc-name    { color: var(--text); font-weight: 500; }

    .value-cell { font-weight: 600; }

    .zscore-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .zscore-track {
      width: 60px; height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .zscore-fill {
      height: 100%;
      border-radius: 3px;
    }
    .zscore-num { font-size: 11px; color: var(--muted); width: 32px; }

    .severity-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .severity-pill.critical { background: rgba(248,81,73,0.15);  color: var(--critical); border: 1px solid rgba(248,81,73,0.3);  }
    .severity-pill.warning  { background: rgba(227,179,65,0.15); color: var(--warning);  border: 1px solid rgba(227,179,65,0.3); }

    /* ── Empty / loading states ────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .empty-sub   { font-size: 13px; }

    .loading-shimmer {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius);
      height: 72px;
      margin-bottom: 10px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ── Error toast ───────────────────────────────────────────────── */
    #error-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(248,81,73,0.15);
      border: 1px solid var(--critical);
      color: var(--critical);
      padding: 10px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      display: none;
      z-index: 200;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot" id="status-dot"></div>
    Monitor Agent Dashboard
  </div>
  <div class="header-right">
    <span id="last-updated"></span>
    <div class="countdown" title="Auto-refreshes every 15 seconds">
      <span style="color:var(--muted)">↻</span>
      <div class="countdown-bar"><div class="countdown-fill" id="countdown-fill" style="width:100%"></div></div>
      <span id="countdown-num">15s</span>
    </div>
    <button class="refresh-btn" onclick="refresh()">⟳ Refresh</button>
  </div>
</header>

<main>
  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Incidents</div>
      <div class="stat-value accent" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Critical Anomalies</div>
      <div class="stat-value critical" id="stat-critical">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Warning Anomalies</div>
      <div class="stat-value warning" id="stat-warning">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Affected Services</div>
      <div class="stat-value ok" id="stat-services">—</div>
    </div>
  </div>

  <!-- Incidents -->
  <div class="section-header">
    <span class="section-title">Incidents</span>
    <span class="incident-count" id="incident-count">loading...</span>
  </div>

  <div class="incidents-list" id="incidents-list">
    <div class="loading-shimmer"></div>
    <div class="loading-shimmer"></div>
    <div class="loading-shimmer"></div>
  </div>
</main>

<div id="error-toast"></div>

<script>
  const API = '';  // same origin
  const REFRESH_INTERVAL = 15; // seconds
  let countdown = REFRESH_INTERVAL;
  let timer;

  // ── Utilities ──────────────────────────────────────────────────────
  function fmtTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso.endsWith('Z') ? iso : iso + 'Z');
    return d.toLocaleString(undefined, {
      month: 'short', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    });
  }

  function fmtRelative(iso) {
    if (!iso) return '';
    const ms = Date.now() - new Date(iso.endsWith('Z') ? iso : iso + 'Z').getTime();
    const s = Math.round(ms / 1000);
    if (s < 60)  return `${s}s ago`;
    if (s < 3600) return `${Math.round(s/60)}m ago`;
    if (s < 86400) return `${Math.round(s/3600)}h ago`;
    return `${Math.round(s/86400)}d ago`;
  }

  function maxSeverity(anomalies) {
    if (anomalies.some(a => a.severity === 'critical')) return 'critical';
    if (anomalies.some(a => a.severity === 'warning'))  return 'warning';
    return 'ok';
  }

  function confBadge(confidence) {
    const cls = confidence >= 70 ? 'high' : confidence >= 50 ? 'medium' : 'low';
    return `<span class="confidence-badge ${cls}">${confidence}% confidence</span>`;
  }

  function sevPill(sev) {
    return `<span class="severity-pill ${sev}">${sev}</span>`;
  }

  function zscoreBar(z) {
    const clamped = Math.min(z / 5 * 100, 100);
    const color = z >= 3.5 ? 'var(--critical)' : 'var(--warning)';
    return `<div class="zscore-bar">
      <div class="zscore-track"><div class="zscore-fill" style="width:${clamped}%;background:${color}"></div></div>
      <span class="zscore-num">${z.toFixed(2)}</span>
    </div>`;
  }

  // ── Render ─────────────────────────────────────────────────────────
  function renderStats(s) {
    document.getElementById('stat-total').textContent    = s.total_incidents;
    document.getElementById('stat-critical').textContent = s.critical_anomalies;
    document.getElementById('stat-warning').textContent  = s.warning_anomalies;
    document.getElementById('stat-services').textContent = s.affected_services;
    document.getElementById('last-updated').textContent  = 'Updated ' + fmtRelative(s.last_updated);

    const dot = document.getElementById('status-dot');
    dot.className = 'logo-dot' +
      (s.critical_anomalies > 0 ? ' has-critical' :
       s.warning_anomalies  > 0 ? ' has-warning'  : '');
  }

  function renderIncidents(incidents) {
    const list = document.getElementById('incidents-list');
    document.getElementById('incident-count').textContent =
      incidents.length + (incidents.length === 1 ? ' incident' : ' incidents');

    if (incidents.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">✅</div>
          <div class="empty-title">No incidents yet</div>
          <div class="empty-sub">Incidents will appear here once anomalies are detected.<br/>
          Make sure <code>run_all.py</code> is running.</div>
        </div>`;
      return;
    }

    list.innerHTML = incidents.map(inc => {
      const sev   = maxSeverity(inc.anomalies || []);
      const count = (inc.anomalies || []).length;

      const anomalyRows = (inc.anomalies || []).map(a => `
        <tr>
          <td>${a.source}</td>
          <td class="svc-name">${a.service}</td>
          <td class="metric-name">${a.metric}</td>
          <td class="value-cell">${a.value !== undefined ? a.value.toFixed(2) : '—'}</td>
          <td>${a.baseline_mean !== undefined ? a.baseline_mean.toFixed(2) : '—'}</td>
          <td>${zscoreBar(a.zscore || 0)}</td>
          <td>${sevPill(a.severity || 'warning')}</td>
          <td style="color:var(--muted);font-size:11px">${fmtTime(a.timestamp)}</td>
        </tr>`).join('');

      return `
      <div class="incident-card severity-${sev}" id="card-${inc.id}">
        <div class="incident-header" onclick="toggleCard('${inc.id}')">
          <span class="incident-id">${inc.id}</span>
          <span class="incident-summary">${inc.summary || 'No summary'}</span>
          <div class="incident-meta">
            ${confBadge(inc.confidence || 0)}
            <span class="incident-time">${fmtRelative(inc.created_at)}</span>
            <span class="expand-icon">›</span>
          </div>
        </div>
        <div class="incident-body">
          <div class="info-grid">
            <div class="info-block">
              <div class="info-block-label">Root Cause</div>
              <div class="info-block-value">${inc.root_cause || '—'}</div>
            </div>
            <div class="info-block">
              <div class="info-block-label">Recommended Actions</div>
              <div class="info-block-value">${
                (inc.actions || []).map((a,i) => `<div style="margin-bottom:4px">${i+1}. ${a}</div>`).join('')
                || '—'
              }</div>
            </div>
          </div>
          <div>
            <div class="anomalies-label">${count} anomal${count===1?'y':'ies'} detected</div>
            <table class="anomalies-table">
              <thead>
                <tr>
                  <th>Source</th>
                  <th>Service</th>
                  <th>Metric</th>
                  <th>Value</th>
                  <th>Baseline</th>
                  <th>Z-Score</th>
                  <th>Severity</th>
                  <th>Timestamp</th>
                </tr>
              </thead>
              <tbody>${anomalyRows}</tbody>
            </table>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function toggleCard(id) {
    document.getElementById('card-' + id).classList.toggle('open');
  }

  // ── Fetch ──────────────────────────────────────────────────────────
  async function refresh() {
    try {
      const [statsRes, incRes] = await Promise.all([
        fetch(API + '/api/stats'),
        fetch(API + '/api/incidents'),
      ]);
      if (!statsRes.ok || !incRes.ok) throw new Error('API error');
      const [stats, incidents] = await Promise.all([statsRes.json(), incRes.json()]);
      renderStats(stats);
      renderIncidents(incidents);
      hideError();
    } catch (e) {
      showError('Cannot reach dashboard API — is run_all.py running?');
    }
    resetCountdown();
  }

  function showError(msg) {
    const t = document.getElementById('error-toast');
    t.textContent = '⚠ ' + msg;
    t.style.display = 'block';
  }
  function hideError() {
    document.getElementById('error-toast').style.display = 'none';
  }

  // ── Countdown ──────────────────────────────────────────────────────
  function resetCountdown() {
    countdown = REFRESH_INTERVAL;
    clearInterval(timer);
    timer = setInterval(() => {
      countdown--;
      document.getElementById('countdown-num').textContent = countdown + 's';
      document.getElementById('countdown-fill').style.width =
        (countdown / REFRESH_INTERVAL * 100) + '%';
      if (countdown <= 0) refresh();
    }, 1000);
  }

  // ── Boot ───────────────────────────────────────────────────────────
  refresh();
</script>
</body>
</html>
