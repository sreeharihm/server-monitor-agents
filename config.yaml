# How often the agent polls all sources, and how it reasons about the results.
poll_interval_minutes: 5
lookback_minutes: 15      # how far back each query looks on every poll
lag_minutes: 5            # anomalies within this many minutes get correlated into one incident

splunk:
  watches:
    - service: order-db
      metric: connection_pool_pct
      spl: >
        search index=prod sourcetype=db host=order-db*
        | stats avg(pool_used_pct) as pct
      value_field: pct
      unit: "%"

cloudwatch:
  watches:
    - service: payment-api
      metric: 5xx_count
      namespace: AWS/ApplicationELB
      metric_name: HTTPCode_Target_5XX_Count
      dimensions:
        - Name: LoadBalancer
          Value: app/payment-api-alb/CHANGE_ME
      statistic: Sum
      period: 60
      unit: Count

prometheus:
  watches:
    - service: auth-service
      metric: latency_p95_ms
      promql: >
        histogram_quantile(0.95, rate(auth_request_duration_seconds_bucket[5m])) * 1000
      unit: ms

datadog:
  watches:
    - service: checkout-web
      metric: error_rate_pct
      query: "avg:checkout.web.error_rate{env:prod}"
      unit: "%"

# A2A mock agents — sub-agent servers that provide mock data without real cloud credentials.
# Start the servers with: python run_all.py (or individually via python -m agents.<name>.server)
a2a_agents:
  mock_anomaly_rate: 0.15   # fraction of 5-minute buckets that inject an anomaly spike
  cloudwatch:
    url: http://localhost:8001
  prometheus:
    url: http://localhost:8002

# Add more watches under each connector to cover more services/metrics.
# Every watch needs: service, metric, and whatever fields that connector needs
# to run its query (see agent/connectors/*.py for what each one expects).
